name: film2
# Renders film II on GitHub's runners: the scenes are split into chunks of frames (plan.py), rendered in parallel,
# then assembled with the stock clips and the mix into HDR10 and SDR files. Results are short-lived artifacts (no release).
# Runs only when film2/render.json changes, so ordinary commits do not start an hour or more of rendering.
on:
  push:
    branches: [film2]
    paths: ["film2/render.json"]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: film2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: echo "matrix=$(python3 film2/plan.py film2/render.json)" >> "$GITHUB_OUTPUT"
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SCENE: ${{ matrix.scene }}
      ENGINE: ${{ matrix.engine }}
      FRAMES: ${{ matrix.frames }}
      RES: ${{ matrix.res }}
      SAMPLES: ${{ matrix.samples }}
      CODEC: ${{ matrix.codec }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: System libraries for Blender (software OpenGL for Eevee)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fonts-inter libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri \
            libxi6 libxkbcommon0 libxxf86vm1 libxfixes3 libxrender1 libsm6
      - run: pip install -q bpy==5.3.0 OpenEXR numpy
      - name: Render
        run: |
          mkdir -p out
          python3 film2/blender/render.py "$SCENE" --engine "$ENGINE" --frames "$FRAMES" --res "$RES" \
            --samples "$SAMPLES" --codec "$CODEC" --out out | grep '"seconds"' | tee "out/timing-$SCENE-${FRAMES%%:*}.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.id }}
          path: out/
          retention-days: 5
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -q numpy scipy dawdreamer
      - run: python3 film2/sound/mix.py mix.wav | tee mix-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mix
          path: |
            mix.wav
            mix-report.txt
          retention-days: 5
  assemble:
    needs: [render, audio]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg && pip install -q numpy opencv-python-headless OpenEXR Pillow
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          path: frames
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: mix
          path: .
      - name: Fetch the stock clips the timeline uses
        run: |
          ids=$(python3 -c "import sys; sys.path.insert(0, 'film2'); import timeline as T; print(' '.join(str(s[1]) for s in T.STOCK))")
          # shellcheck disable=SC2086
          python3 film2/tools/fetch_stock.py film2/stock.json --out stock --only $ids
      - name: Assemble
        run: |
          mkdir -p film
          python3 film2/assemble.py --frames frames --stock stock --audio mix.wav --out film/sdht-film2-m1
          cat frames/timing-*.jsonl > film/render-timing.jsonl
          cp mix-report.txt film/
      - uses: actions/upload-artifact@v4
        with:
          name: film2-m1
          path: film/
          retention-days: 7
