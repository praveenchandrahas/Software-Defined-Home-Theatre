# versions.lock: the component versions of one sdht release, and the sha256 of each .deb as published by the component's own release.
# Lines are TAB separated.  deb<TAB>name<TAB>version<TAB>file<TAB>sha256   external<TAB>name<TAB>version<TAB>url<TAB>sha256<TAB>member
